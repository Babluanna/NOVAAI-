<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova AI — Redirecting…</title>
  <script>
    (function () {
      var parts = window.location.pathname.split("/").filter(Boolean);
      var base = parts.length > 0 ? "/" + parts[0] + "/" : "/";
      window.location.replace(base);
    })();
  </script>
  <style>
    body {
      background: #09090b;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    a { color: #ffb347; }
  </style>
</head>
<body>
  <div>
    <h1>Nova AI</h1>
    <p>Redirecting to the home page… <a href="./">Open Nova AI</a></p>
  </div>
</body>
</html>
